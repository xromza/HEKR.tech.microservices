server:
    port: 8080

services:
    catalog:
        url: http://catalog-service:8080
    user:
        url: http://user-service:8080

resilience4j:
    circuitbreaker:
        instances:
            catalogService:
                sliding-window-size: 10
                failure-rate-threshold: 50
                wait-duration-in-open-state: 30s
                permitted-number-of-calls-in-half-open-state: 3
                record-exceptions:
                    - org.springframework.web.client.ResourceAccessException 
                    - java.net.ConnectException                             
                    - java.net.SocketTimeoutException 
    retry:
        instances:
            catalogService:
                max-attempts: 2
                exponential-backoff-multiplier: 2
                wait-duration: 500ms
                    

spring:
    application:
        name: order-service-worker
    
    datasource:
        url: ${DB_URL}?currentSchema=order-schema
        username: ${DB_USER}
        password: ${DB_PASS}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                default-schema: order-schema
    
    flyway:
        enabled: true
        default-schema: order-schema
        create-schemas: true
        locations: classpath:db/migration
    
    rabbitmq:
        host: ${RABBITMQ_HOST}
        port: ${RABBITMQ_PORT}
        username: ${RABBITMQ_USER}
        password: ${RABBITMQ_PASS}
        listener: 
            simple:
                prefetch: 10
                retry:
                    enabled: true
                    max-retries: 3

management:
    endpoints:
        web:
            exposure:
                include: health, info, metrics
    endpoint:
        health:
            show-details: always