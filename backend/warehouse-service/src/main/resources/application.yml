server:
    port: 8080

spring:
    application:
        name: warehouse-service
    
    datasource:
        url: ${DB_URL}?currentSchema=warehouse-schema
        username: ${DB_USER}
        password: ${DB_PASS}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                default-schema: warehouse-schema
    
    flyway:
        enabled: true
        default-schema: warehouse-schema
        create-schemas: true
        locations: classpath:db/migration
    
    rabbitmq:
        host: ${RABBITMQ_HOST}
        port: ${RABBITMQ_PORT}
        username: ${RABBITMQ_USER}
        password: ${RABBITMQ_PASS}
        listener: 
            simple: 
                retry:
                    enabled: true
                    max-retries: 3
    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
management:
    endpoints:
        web:
            exposure:
                include: health, info, metrics
    endpoint:
        health:
            show-details: always