server:
    port: 8080

spring:
    application:
        name: order-service
    
    rabbitmq:
        host: ${RABBITMQ_HOST}
        port: ${RABBITMQ_PORT}
        username: ${RABBITMQ_USER}
        password: ${RABBITMQ_PASS}
        listener: 
            simple: 
                retry:
                    enabled: true
                    max-retries: 3
    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}

resilience4j:
    circuitbreaker:
        instances:
            orderWorkerService:
                sliding-window-size: 10
                failure-rate-threshold: 50
                wait-duration-in-open-state: 30s
                permitted-number-of-calls-in-half-open-state: 3
                record-exceptions:
                    - org.springframework.web.client.ResourceAccessException 
                    - java.net.ConnectException                             
                    - java.net.SocketTimeoutException 
            catalogService:
                sliding-window-size: 10
                failure-rate-threshold: 50
                wait-duration-in-open-state: 60s
                permitted-number-of-calls-in-half-open-state: 5
                record-exceptions:
                    - org.springframework.web.client.ResourceAccessException
                    - java.net.ConnectException 
                    - java.net.SocketTimeoutException 
            userService:
                slidingWindowSize: 10
                failureRateThreshold: 50
                waitDurationInOpenState: 60s
                record-exceptions:
                    - org.springframework.web.client.ResourceAccessException
                    - java.net.ConnectException 
                    - java.net.SocketTimeoutException 
                
            warehouseService:
                slidingWindowSize: 10
                failureRateThreshold: 50
                waitDurationInOpenState: 30s
                record-exceptions:
                    - org.springframework.web.client.ResourceAccessException
                    - java.net.ConnectException 
                    - java.net.SocketTimeoutException 
            rabbitMqService:
                failureRateThreshold: 50
                waitDurationInOpenState: 10s
                slidingWindowSize: 10
    retry:
        instances:
            rabbitMqService:
                maxAttempts: 3
                waitDuration: 1s
            orderWorkerService:
                maxAttempts: 2
                waitDuration: 1s
                exponential-backoff-multiplier: 2
                ignore-exceptions:
                    - ru.xromza.order.exceptions.ForbiddenException
            
            catalogService:
                maxAttempts: 2
                waitDuration: 500ms
                exponential-backoff-multiplier: 2
            
            userService:
                maxAttempts: 2
                waitDuration: 500ms
                exponential-backoff-multiplier: 2
            
            warehouseService:
                maxAttempts: 2
                waitDuration: 500ms
                exponential-backoff-multiplier: 2
                
services:
    catalog:
        url: http://catalog-service:8080
    order-worker:
        url: http://order-service-worker:8080
    user:
        url: http://user-service:8080
    warehouse:
        url: http://warehouse-service:8080

management:
    endpoints:
        web:
            exposure:
                include: health, info, metrics
    endpoint:
        health:
            show-details: always