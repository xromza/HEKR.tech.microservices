server:
    port: 8082

spring:
    application:
        name: order-service
    
    datasource:
        url: jdbc:postgresql://localhost:5432/hekr_store_db?currentSchema=order-schema
        username: hekr_admin
        password: hekr_password
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                default-schema: order-schema
    
    flyway:
        enabled: true
        default-schema: order-schema
        create-schemas: true
        locations: classpath:db/migration
    
    rabbitmq:
        host: localhost
        port: 5672
        username: guest
        password: guest
        listener: 
            simple: 
                retry:
                    enabled: true
                    max-retries: 3
    data:
        redis:
            host: localhost
            port: 6379
management:
    endpoints:
        web:
            exposure:
                include: health, info, metrics
    endpoint:
        health:
            show-details: always