server:
    port: 8083

jwt:
    secret: "MzIzYjNjYTU1MjE1NWRmM2ZhMTZjOWRhZjIzODM1OTg3ZjRlZDQ1NTNlZjQ0MWFiYTZlYWY2YTlmZWUzNTFlYw=="
    expiration: 3600000
    refresh-token:
        expiration: 604800000

spring:
    application:
        name: user-service
    
    datasource:
        url: jdbc:postgresql://localhost:5432/hekr_store_db?currentSchema=user-schema
        username: hekr_admin
        password: hekr_password
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                default-schema: user-schema
    
    flyway:
        enabled: true
        default-schema: user-schema
        create-schemas: true
        locations: classpath:db/migration
    
    rabbitmq:
        host: localhost
        port: 5672
        username: guest
        password: guest
        listener: 
            simple: 
                retry:
                    enabled: true
                    max-retries: 3
    data:
        redis:
            host: localhost
            port: 6379
management:
    endpoints:
        web:
            exposure:
                include: health, info, metrics
    endpoint:
        health:
            show-details: always