server:
    port: 8080

jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}
    refresh-token:
        expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

spring:
    application:
        name: user-service
    
    datasource:
        url: ${DB_URL}?currentSchema=user-schema
        username: ${DB_USER}
        password: ${DB_PASS}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                default-schema: user-schema
    
    flyway:
        enabled: true
        default-schema: user-schema
        create-schemas: true
        locations: classpath:db/migration
    
    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
management:
    endpoints:
        web:
            exposure:
                include: health, info, metrics
    endpoint:
        health:
            show-details: always